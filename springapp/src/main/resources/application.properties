spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost/Library?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.com.examly=DEBUG
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ── Multipart limits ──────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ── Document Vault Storage ────────────────────────────────────────────────────
vault.storage.upload-dir=/var/vault/documents
vault.storage.temp-dir=/var/vault/temp
vault.storage.backup-dir=/var/vault/backup
vault.storage.version-dir=/var/vault/versions
vault.storage.ocr-dir=/var/vault/ocr
vault.storage.preview-dir=/var/vault/preview
vault.storage.audit-dir=/var/vault/audit
vault.storage.max-file-size=104857600
vault.storage.max-request-size=110100480
vault.storage.encryption-enabled=true
vault.storage.allowed-file-types=pdf,doc,docx,xls,xlsx,jpg,jpeg,png,tiff,txt,csv
vault.storage.allowed-mime-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/jpeg,image/png,image/tiff,text/plain,text/csv
